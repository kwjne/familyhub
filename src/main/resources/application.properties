server.port=8080
spring.application.name=familyhub

# Встроенная база H2 (работает прямо в памяти, без установки и без Docker)
spring.datasource.url=jdbc:h2:mem:family_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Настройки JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Веб-консоль H2 для просмотра таблиц (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

